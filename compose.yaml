name: nightwatch
services:
  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "${NIGHTWATCH_WEB_BIND:-127.0.0.1}:${NIGHTWATCH_WEB_PORT:-4180}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 4s
      retries: 5

  api:
    build:
      context: .
      target: api
    env_file:
      - path: .env.local
        required: false
    environment:
      NIGHTWATCH_API_HOST: 0.0.0.0
      NIGHTWATCH_API_PORT: 4100
      NIGHTWATCH_RECORDINGS_DIR: /app/data/recordings
      DATABASE_URL: "postgresql://nightwatch:${NIGHTWATCH_DB_PASSWORD:-nightwatch-local}@db:5432/nightwatch"
    volumes:
      - recordings:/app/data
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 23s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 8

  db:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_USER: nightwatch
      POSTGRES_DB: nightwatch
      POSTGRES_PASSWORD: "${NIGHTWATCH_DB_PASSWORD:-nightwatch-local}"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nightwatch", "-d", "nightwatch"]
      interval: 5s
      timeout: 4s
      retries: 15

volumes:
  postgres:
  recordings:
